<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar | Anne Vitoris</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="header.css">
</head>
<body>

  <div id="site-header" data-page="login"></div>

  <main class="login-pagina">
    <section class="login-caixa">
      <h1>Entrar</h1>
      <p class="login-aviso">Área restrita à administração do portfólio.</p>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="username" required>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="current-password" required>
        </div>

        <p id="mensagem-erro" class="mensagem-erro" role="alert" hidden></p>

        <button type="submit" id="botao-entrar" class="botao botao-cheio">Entrar</button>
      </form>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="login.js"></script>
  <script src="header.js"></script>
</body>
</html>
