<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Projetos e sites desenvolvidos por Anne Vitoris.">
  <title>Portfólio | Anne Vitoris</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-projetos">

  <header>
    <nav>
      <a href="index.html" class="logo">
        <img src="logo.png" alt="Logo do meu portfólio">
      </a>

      <ul class="links">
        <li><a href="index.html">Início</a></li>
        <li><a href="quemsoueu.html">Quem sou eu</a></li>
        <li><a href="projetos.html">Portfólio</a></li>
      </ul>

      <a href="login.html" class="login" aria-label="Ir para a página de login">
        <i data-lucide="lock"></i>
      </a>
    </nav>
  </header>

  <main class="projetos-pagina">
    <section class="projetos-topo" aria-labelledby="titulo-projetos">
      <span class="projetos-etiqueta"><i data-lucide="code-2"></i> MEU TRABALHO</span>
      <h1 id="titulo-projetos">Meus <span>Projetos.</span></h1>
      <p>Conheça projetos, experiências práticas e soluções que fazem parte da minha evolução na tecnologia.</p>
    </section>

    <section class="projetos-filtros" aria-label="Filtrar projetos">
      <button class="filtro-projeto ativo" type="button" data-filtro="Todos" aria-pressed="true">Todos</button>
      <button class="filtro-projeto" type="button" data-filtro="Desenvolvimento Web" aria-pressed="false">Desenvolvimento Web</button>
      <button class="filtro-projeto" type="button" data-filtro="Sistemas" aria-pressed="false">Sistemas</button>
      <button class="filtro-projeto" type="button" data-filtro="Interfaces" aria-pressed="false">Interfaces</button>
      <button class="filtro-projeto" type="button" data-filtro="Outros" aria-pressed="false">Outros</button>
    </section>

    <p id="estado" class="estado-vazio" role="status" aria-live="polite">Carregando projetos...</p>
    <ul id="grade-projetos" class="grade-projetos" aria-label="Lista de projetos"></ul>

    <p class="projetos-final">Cada projeto representa uma nova experiência e evolução na minha jornada como desenvolvedora.</p>
  </main>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="projetos.js"></script>
</body>
</html>
